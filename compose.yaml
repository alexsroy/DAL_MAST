services:
  dalmast:
    build: .
    image: rredwiz/dalmast:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      DISPLAY: ${DISPLAY}
      ROS_DOMAIN_ID: "0"
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    command: sleep infinity
